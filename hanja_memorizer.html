<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>한자 암기장</title>
<style>
  :root{
    --paper:#f5f1e8;
    --ink:#2b2620;
    --ink-soft:#6b6255;
    --seal:#a8362a;
    --line:#d8d0bd;
    --card:#fffdf8;
    --good:#3f6b4a;
    --bad:#a8362a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Serif KR","Nanum Myeongjo",serif;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:28px;
    letter-spacing:2px;
    margin:0 0 4px;
  }
  header .sub{
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:1px;
  }
  .seal{
    display:inline-block;
    width:34px;height:34px;
    line-height:34px;
    background:var(--seal);
    color:#fff;
    border-radius:4px;
    font-size:16px;
    margin-bottom:8px;
  }
  nav{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  nav button{
    flex:1;
    background:none;
    border:none;
    padding:12px 0;
    font-family:inherit;
    font-size:15px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:.15s;
  }
  nav button.active{
    color:var(--ink);
    border-bottom-color:var(--seal);
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px;
    margin-bottom:16px;
  }
  .field{
    margin-bottom:12px;
  }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
    letter-spacing:.5px;
  }
  .field input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:inherit;
    font-size:16px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--seal);
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  button.primary{
    width:100%;
    padding:12px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    font-family:inherit;
    font-size:15px;
    letter-spacing:1px;
    cursor:pointer;
  }
  button.primary:hover{opacity:.88;}
  button.ghost{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:6px 10px;
    border-radius:4px;
    font-family:inherit;
    font-size:12px;
    cursor:pointer;
  }
  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .han{
    font-size:26px;
    width:44px;
    text-align:center;
  }
  .entry .info{
    flex:1;
    padding:0 12px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .entry .info .meaning{
    color:var(--ink);
    font-size:14px;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:20px 0;
  }
  /* test mode */
  .test-progress{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
    letter-spacing:1px;
  }
  .prompt{
    text-align:center;
    padding:30px 10px;
  }
  .prompt .meaning{
    font-size:24px;
    margin-bottom:6px;
  }
  .prompt .hint{
    font-size:12px;
    color:var(--ink-soft);
  }
  .canvas-wrap{
    display:flex;
    justify-content:center;
    margin:16px 0 8px;
  }
  #drawCanvas{
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    touch-action:none;
    cursor:crosshair;
  }
  .canvas-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:12px;
  }
  .reveal-han{
    text-align:center;
    font-size:48px;
    color:var(--seal);
    margin:10px 0;
  }
  .self-grade{
    display:flex;
    gap:10px;
  }
  .self-grade button{
    flex:1;
  }
  button.bad-btn{
    background:none;
    border:1px solid var(--bad);
    color:var(--bad);
  }
  button.good-btn{
    background:none;
    border:1px solid var(--good);
    color:var(--good);
  }
  .feedback{
    text-align:center;
    font-size:14px;
    height:20px;
    margin-bottom:8px;
  }
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .result-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .result-item:last-child{border-bottom:none;}
  .result-item .mark{
    width:22px;
    font-size:16px;
  }
  .result-item .mark.good{color:var(--good);}
  .result-item .mark.bad{color:var(--bad);}
  .result-item .han-answer{
    width:40px;
    height:40px;
    border:1px solid var(--line);
    border-radius:4px;
  }
  .result-item .detail{
    flex:1;
    font-size:12px;
    color:var(--ink-soft);
  }
  .result-item .correct-han{
    font-size:22px;
    color:var(--seal);
    width:36px;
    text-align:center;
  }
  .summary{
    text-align:center;
    padding:16px 0 24px;
  }
  .summary .score{
    font-size:40px;
    color:var(--seal);
  }
  .summary .score span{
    font-size:20px;
    color:var(--ink-soft);
  }
  .msg{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:16px 0;
  }
  .version-tag{
    position:fixed;
    right:12px;
    bottom:10px;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.5px;
  }
  .pager{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding-top:12px;
    margin-top:8px;
  }
  .pager-label{
    font-size:12px;
    color:var(--ink-soft);
  }
  .pager button:disabled{
    opacity:.4;
    cursor:default;
  }
  /* calendar */
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-header .cal-title{
    font-size:16px;
    letter-spacing:1px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:4px;
    text-align:center;
  }
  .cal-dow{
    font-size:11px;
    color:var(--ink-soft);
    padding:4px 0;
  }
  .cal-day{
    position:relative;
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    font-size:13px;
    cursor:default;
  }
  .cal-day.has-session{
    cursor:pointer;
    background:#f0e9d8;
  }
  .cal-day.has-session:hover{
    background:#e6dcc4;
  }
  .cal-day.selected{
    outline:2px solid var(--seal);
  }
  .cal-day .rate{
    font-size:9px;
    color:var(--seal);
  }
  .cal-day.empty{visibility:hidden;}
  .cal-detail{
    margin-top:16px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .cal-detail .cal-detail-title{
    font-size:14px;
    margin-bottom:8px;
  }
  .cal-session{
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .cal-session:last-child{border-bottom:none;}
  .cal-session .cal-session-summary{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .cal-item-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    padding:3px 0;
  }
  .cal-item-row .mark{width:16px;}
  .cal-item-row .han{font-size:16px;width:22px;text-align:center;}
  /* import conflict */
  .conflict{
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .conflict:last-child{border-bottom:none;}
  .conflict .conflict-han{
    font-size:20px;
    margin-bottom:8px;
  }
  .conflict-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .conflict-option{
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .conflict-option .label{
    font-size:11px;
    letter-spacing:.5px;
    margin-bottom:4px;
  }
  .conflict-option.selected{
    border-color:var(--seal);
    color:var(--ink);
    background:#fbf3ea;
  }
  .policy-links{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:0 0 40px;
  }
  .policy-links a{color:var(--ink-soft);}
  /* kind switch / words */
  .kind-switch{
    display:flex;
    margin-bottom:12px;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .kind-switch button{
    flex:1;
    padding:8px 0;
    background:none;
    border:none;
    font-family:inherit;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .kind-switch button.active{
    background:var(--ink);
    color:var(--paper);
  }
  .entry .word-main{
    font-size:20px;
    color:var(--ink);
    margin-bottom:2px;
  }
  .cal-item-row .word{font-size:14px;}
  /* dict search */
  .search-row{
    display:flex;
    gap:8px;
  }
  .search-row input{flex:1;}
  .search-row button{flex:none;}
  #searchResult, #wordSearchResult{
    max-height:360px;
    overflow-y:auto;
  }
  .entry .tag{
    font-size:11px;
    color:var(--good);
  }
  .dict-credit{
    font-size:10px;
    color:var(--ink-soft);
    text-align:right;
    margin-top:8px;
  }
  /* google sync */
  .sync-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    margin-bottom:12px;
  }
  .sync-status{
    flex:1 1 100%;
    font-size:12px;
    color:var(--ink-soft);
    word-break:break-all;
  }
  .sync-status.warn{color:var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>한자 암기장</h1>
    <div class="sub">오류 및 개선 사항 요청은 Discord - 냉면#6848 로 연락 부탁드립니다.</div>
  </header>

  <div class="sync-bar">
    <span id="syncStatus" class="sync-status">로그인하지 않음</span>
    <button class="ghost" id="btnLogin">구글 로그인</button>
    <button class="ghost" id="btnPull" style="display:none">시트에서 불러오기</button>
    <button class="ghost" id="btnSwitch" style="display:none">계정 전환</button>
    <button class="ghost" id="btnLogout" style="display:none">로그아웃</button>
  </div>

  <div class="kind-switch">
    <button data-kind="hanja">한자</button>
    <button data-kind="word">단어</button>
  </div>

  <nav>
    <button id="tabAdd" class="active">등록</button>
    <button id="tabList">목록</button>
    <button id="tabTest">시험</button>
    <button id="tabCalendar">달력</button>
  </nav>

  <div id="viewAdd">
    <div class="card">
      <div class="field">
        <label>사전 검색</label>
        <div class="search-row">
          <input id="inSearch" placeholder="예: 뫼 산 · 산 · 山 · やま">
          <button class="ghost" id="btnSearch">검색</button>
        </div>
      </div>
      <div id="searchResult"></div>
      <div class="dict-credit">사전 데이터: libhangul · KANJIDIC2 (EDRDG, CC BY-SA 4.0)</div>
    </div>
    <div class="card">
      <div class="field">
        <label>한자</label>
        <input id="inHan" maxlength="4" placeholder="예: 山">
      </div>
      <div class="row2">
        <div class="field">
          <label>훈독</label>
          <input id="inKun" placeholder="예: やま">
        </div>
        <div class="field">
          <label>음독</label>
          <input id="inOn" placeholder="예: さん">
        </div>
      </div>
      <div class="field">
        <label>뜻</label>
        <input id="inMeaning" placeholder="예: 뫼 산, 산 산">
      </div>
      <button class="primary" id="btnSave">저장</button>
    </div>
    <div id="saveMsg" class="msg"></div>
  </div>

  <div id="viewList" style="display:none">
    <div class="card">
      <div class="row2">
        <button class="ghost" id="btnExport">내보내기</button>
        <button class="ghost" id="btnImport">가져오기</button>
      </div>
      <input type="file" id="fileImport" accept=".json" style="display:none">
    </div>
    <div id="conflictCard"></div>
    <div class="card" id="listCard">
      <div class="empty">등록된 한자가 없습니다.</div>
    </div>
  </div>

  <div id="viewTest" style="display:none">
    <div class="card" id="testCard"></div>
    <button class="ghost" id="btnShowExcluded" style="width:100%">제외한 한자 목록 보기</button>
  </div>

  <div id="viewCalendar" style="display:none">
    <div class="card" id="calendarCard"></div>
  </div>

  <div id="viewWordAdd" style="display:none">
    <div class="card">
      <div class="field">
        <label>사전 검색</label>
        <div class="search-row">
          <input id="inWordSearch" placeholder="예: 山登り · やまのぼり · climbing">
          <button class="ghost" id="btnWordSearch">검색</button>
        </div>
      </div>
      <div id="wordSearchResult"></div>
      <div class="dict-credit">사전 데이터: JMdict (EDRDG, CC BY-SA 4.0)</div>
    </div>
    <div class="card">
      <div class="field">
        <label>단어</label>
        <input id="inWord" placeholder="예: 山登り">
      </div>
      <div class="field">
        <label>읽는 법</label>
        <input id="inReading" placeholder="예: やまのぼり">
      </div>
      <div class="field">
        <label>뜻</label>
        <input id="inWordMeaning" placeholder="예: 등산">
      </div>
      <button class="primary" id="btnWordSave">저장</button>
    </div>
    <div id="wordSaveMsg" class="msg"></div>
  </div>

  <div id="viewWordList" style="display:none">
    <div class="card">
      <div class="row2">
        <button class="ghost" id="btnWordExport">내보내기</button>
        <button class="ghost" id="btnWordImport">가져오기</button>
      </div>
    </div>
    <div class="card" id="wordListCard"></div>
  </div>

  <div id="viewWordTest" style="display:none">
    <div class="card" id="wordTestCard"></div>
    <button class="ghost" id="btnShowExcludedWords" style="width:100%">제외한 단어 목록 보기</button>
  </div>
</div>
<div class="policy-links">
  <a href="privacy.html" target="_blank">개인정보처리방침</a> ｜ <a href="terms.html" target="_blank">서비스 약관</a>
</div>
<div class="version-tag">ver.1.4</div>

<script>
const STORAGE_KEY = 'hanjaEntries';
const SESSIONS_KEY = 'hanjaTestSessions';
let entries = [];
let testQueue = [];
let testIndex = 0;
let testResults = [];
let sessions = [];
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedDate = null;
const PAGE_SIZE = 100;
let listPage = 0;

const viewAdd = document.getElementById('viewAdd');
const viewList = document.getElementById('viewList');
const viewTest = document.getElementById('viewTest');
const viewCalendar = document.getElementById('viewCalendar');
const tabAdd = document.getElementById('tabAdd');
const tabList = document.getElementById('tabList');
const tabTest = document.getElementById('tabTest');
const tabCalendar = document.getElementById('tabCalendar');
const viewWordAdd = document.getElementById('viewWordAdd');
const viewWordList = document.getElementById('viewWordList');
const viewWordTest = document.getElementById('viewWordTest');

function setTab(name){
  _tab = name;
  const word = _kind === 'word';
  [tabAdd, tabList, tabTest, tabCalendar].forEach(b => b.classList.remove('active'));
  [viewAdd, viewList, viewTest, viewCalendar, viewWordAdd, viewWordList, viewWordTest]
    .forEach(v => v.style.display = 'none');
  if(name === 'add'){
    tabAdd.classList.add('active');
    (word ? viewWordAdd : viewAdd).style.display = 'block';
  }
  if(name === 'list'){
    tabList.classList.add('active');
    if(word){ viewWordList.style.display = 'block'; RenderWordList(); }
    else { viewList.style.display = 'block'; renderList(); }
  }
  if(name === 'test'){
    tabTest.classList.add('active');
    if(word){ viewWordTest.style.display = 'block'; RenderWordTestStart(); }
    else { viewTest.style.display = 'block'; startTest(); }
  }
  if(name === 'calendar'){ tabCalendar.classList.add('active'); viewCalendar.style.display = 'block'; selectedDate = null; renderCalendar(); }
}
tabAdd.onclick = () => setTab('add');
tabList.onclick = () => setTab('list');
tabTest.onclick = () => setTab('test');
tabCalendar.onclick = () => setTab('calendar');
document.getElementById('btnShowExcluded').onclick = () => showExcludedList();

function showExcludedList(){
  const excluded = entries.filter(e => e.excluded);
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(43,38,32,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;';

  const listHtml = excluded.length === 0
    ? '<div class="empty">제외한 단어가 없습니다.</div>'
    : excluded.map(e => `
        <div class="entry">
          <div class="han">${e.han}</div>
          <div class="info">
            <div class="meaning">${e.meaning}</div>
            <div>훈독: ${e.kun || '-'} · 음독: ${e.on || '-'}</div>
          </div>
          <button class="ghost" data-release="${e.id}">해제</button>
        </div>
      `).join('');

  overlay.innerHTML = `
    <div class="card" style="max-width:400px;width:100%;max-height:70vh;overflow-y:auto;">
      <div class="msg" style="padding:0 0 10px">제외한 단어 목록</div>
      ${listHtml}
      <button class="primary" id="excludedClose" style="margin-top:12px">닫기</button>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('button[data-release]').forEach(btn => {
    btn.onclick = async () => {
      const entry = entries.find(e => e.id === btn.dataset.release);
      if(entry) entry.excluded = false;
      await saveEntries();
      overlay.remove();
      showExcludedList();
    };
  });
  overlay.querySelector('#excludedClose').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
}

async function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
}

async function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    MarkDirty();
  }catch(e){
    console.error('저장 실패', e);
  }
}

async function loadSessions(){
  try{
    const raw = localStorage.getItem(SESSIONS_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  }catch(e){
    sessions = [];
  }
}

async function saveSessions(){
  try{
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
    MarkDirty();
  }catch(e){
    console.error('저장 실패', e);
  }
}

function todayKey(){
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

document.getElementById('btnSave').onclick = async () => {
  const han = document.getElementById('inHan').value.trim();
  const on = document.getElementById('inOn').value.trim();
  const kun = document.getElementById('inKun').value.trim();
  const meaning = document.getElementById('inMeaning').value.trim();
  const msg = document.getElementById('saveMsg');

  if(!han || !meaning){
    msg.textContent = '한자와 뜻은 필수 입력입니다.';
    return;
  }

  entries.push({ id: Date.now().toString(), han, on, kun, meaning });
  await saveEntries();

  document.getElementById('inHan').value = '';
  document.getElementById('inOn').value = '';
  document.getElementById('inKun').value = '';
  document.getElementById('inMeaning').value = '';
  msg.textContent = `'${han}' 저장 완료`;
  setTimeout(() => msg.textContent = '', 1500);
};

function exportData(){
  const payload = { entries, sessions, words };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `hanja_backup_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('btnExport').onclick = () => exportData();

document.getElementById('btnImport').onclick = () => {
  document.getElementById('fileImport').click();
};

document.getElementById('fileImport').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);

    let importedEntries = [];
    let importedSessions = [];
    let importedWords = [];
    if(Array.isArray(imported)){
      importedEntries = imported;
    } else if(imported && typeof imported === 'object'){
      importedEntries = Array.isArray(imported.entries) ? imported.entries : [];
      importedSessions = Array.isArray(imported.sessions) ? imported.sessions : [];
      importedWords = Array.isArray(imported.words) ? imported.words : [];
    } else {
      throw new Error('형식 오류');
    }

    if(importedWords.length > 0) await MergeWords(importedWords);
    if(importedSessions.length > 0) await mergeSessions(importedSessions);
    processImport(importedEntries);
  }catch(err){
    alert('파일을 읽을 수 없습니다. JSON 형식을 확인해주세요.');
  }
  e.target.value = '';
};

async function mergeSessions(importedSessions){
  importedSessions.forEach(s => {
    const dup = sessions.some(existing => JSON.stringify(existing) === JSON.stringify(s));
    if(!dup) sessions.push(s);
  });
  await saveSessions();
}

function processImport(importedList){
  const freshList = [];
  const conflicts = [];
  importedList.forEach(imp => {
    if(!imp.han || !imp.meaning) return;
    const existingIndex = entries.findIndex(e => e.han === imp.han);
    if(existingIndex >= 0){
      if(!IsSameEntry(entries[existingIndex], imp)){
        conflicts.push({ existingIndex, existing: entries[existingIndex], imported: imp, choice: 'existing' });
      }
    } else {
      freshList.push(imp);
    }
  });

  if(conflicts.length === 0){
    applyImport(freshList, []);
    return;
  }
  renderConflictUI(freshList, conflicts);
}

function renderConflictUI(freshList, conflicts){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(43,38,32,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;';
  overlay.innerHTML = `
    <div class="card" style="max-width:400px;width:100%;max-height:80vh;overflow-y:auto;">
      <div class="msg" style="padding:0 0 12px">중복된 한자 ${conflicts.length}건 발견 · 사용할 데이터를 선택하세요</div>
      ${conflicts.map((c, i) => `
        <div class="conflict">
          <div class="conflict-han">${c.existing.han}</div>
          <div class="conflict-options">
            <div class="conflict-option selected" data-idx="${i}" data-choice="existing">
              <div class="label">기존 데이터</div>
              <div>훈독: ${c.existing.kun || '-'} · 음독: ${c.existing.on || '-'}</div>
              <div>뜻: ${c.existing.meaning}</div>
            </div>
            <div class="conflict-option" data-idx="${i}" data-choice="imported">
              <div class="label">가져온 데이터</div>
              <div>훈독: ${c.imported.kun || '-'} · 음독: ${c.imported.on || '-'}</div>
              <div>뜻: ${c.imported.meaning}</div>
            </div>
          </div>
        </div>
      `).join('')}
      <button class="primary" id="btnApplyImport" style="margin-top:14px">적용</button>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.conflict-option').forEach(el => {
    el.onclick = () => {
      const idx = Number(el.dataset.idx);
      conflicts[idx].choice = el.dataset.choice;
      overlay.querySelectorAll(`.conflict-option[data-idx="${idx}"]`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    };
  });

  overlay.querySelector('#btnApplyImport').onclick = () => {
    applyImport(freshList, conflicts);
    overlay.remove();
  };
}

async function applyImport(freshList, conflicts){
  freshList.forEach(imp => {
    entries.push({
      id: Date.now().toString() + Math.random().toString(36).slice(2),
      han: imp.han,
      on: imp.on || '',
      kun: imp.kun || '',
      meaning: imp.meaning || '',
      excluded: !!imp.excluded
    });
  });
  conflicts.forEach(c => {
    if(c.choice === 'imported'){
      entries[c.existingIndex] = {
        ...entries[c.existingIndex],
        on: c.imported.on || '',
        kun: c.imported.kun || '',
        meaning: c.imported.meaning || '',
        excluded: !!c.imported.excluded
      };
    }
  });
  await saveEntries();
  renderList();
  if(_hold){
    _hold = false;
    SchedulePush(0);
  }
}

function IsSameEntry(a, b){
  return (a.on || '') === (b.on || '')
    && (a.kun || '') === (b.kun || '')
    && a.meaning === b.meaning
    && !!a.excluded === !!b.excluded;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let canvasCtx = null;
let drawing = false;

function setupCanvas(canvas){
  canvasCtx = canvas.getContext('2d');
  canvasCtx.lineWidth = 6;
  canvasCtx.lineCap = 'round';
  canvasCtx.strokeStyle = '#2b2620';
  clearCanvas();

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){
    e.preventDefault();
    drawing = true;
    const p = pos(e);
    canvasCtx.beginPath();
    canvasCtx.moveTo(p.x, p.y);
  }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    canvasCtx.lineTo(p.x, p.y);
    canvasCtx.stroke();
  }
  function end(){ drawing = false; }

  canvas.onmousedown = start;
  canvas.onmousemove = move;
  canvas.onmouseup = end;
  canvas.onmouseleave = end;
  canvas.ontouchstart = start;
  canvas.ontouchmove = move;
  canvas.ontouchend = end;
}

function clearCanvas(){
  if(!canvasCtx) return;
  const { width, height } = canvasCtx.canvas;
  canvasCtx.fillStyle = '#fff';
  canvasCtx.fillRect(0, 0, width, height);
  canvasCtx.save();
  canvasCtx.strokeStyle = '#c9c0ac';
  canvasCtx.lineWidth = 1;
  canvasCtx.setLineDash([4, 4]);
  canvasCtx.beginPath();
  canvasCtx.moveTo(width / 2, 0);
  canvasCtx.lineTo(width / 2, height);
  canvasCtx.moveTo(0, height / 2);
  canvasCtx.lineTo(width, height / 2);
  canvasCtx.stroke();
  canvasCtx.restore();
}

function revealAnswer(item){
  const card = document.getElementById('testCard');
  const drawingImage = canvasCtx.canvas.toDataURL();
  const total = testQueue.length;

  card.innerHTML = `
    <div class="test-progress">${testIndex + 1} / ${total}</div>

      <canvas id="reviewCanvas" width="220" height="220"></canvas>

      <button class="good-btn" id="btnRight">맞았어요</button>
    </div>
  `;

  const reviewCanvas = document.getElementById('reviewCanvas');
  const reviewCtx = reviewCanvas.getContext('2d');
  const img = new Image();
  img.onload = () => reviewCtx.drawImage(img, 0, 0);
  img.src = drawingImage;

}

function renderCalendar(){
  const card = document.getElementById('calendarCard');
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  const byDate = {};
  sessions.forEach(s => {
    if(!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  const dows = ['일', '월', '화', '수', '목', '금', '토'];
  let cells = '';
  for(let i = 0; i < startDow; i++){
    cells += `<div class="cal-day empty"></div>`;
  }
  for(let d = 1; d <= daysInMonth; d++){
    const mm = String(calMonth + 1).padStart(2, '0');
    const dd = String(d).padStart(2, '0');
    const dateKey = `${calYear}-${mm}-${dd}`;
    const daySessions = byDate[dateKey];
    let rateHtml = '';
    let hasClass = '';
    if(daySessions){
      hasClass = 'has-session';
      const dTotal = daySessions.reduce((sum, s) => sum + s.total, 0);
      const dCorrect = daySessions.reduce((sum, s) => sum + s.correct, 0);
      const rate = dTotal > 0 ? Math.round((dCorrect / dTotal) * 100) : 0;
      rateHtml = `<div class="rate">${rate}%</div>`;
    }
    const selClass = selectedDate === dateKey ? 'selected' : '';
    cells += `<div class="cal-day ${hasClass} ${selClass}" data-date="${dateKey}">${d}${rateHtml}</div>`;
  }

  card.innerHTML = `
    <div class="cal-header">
      <button class="ghost" id="calPrev">‹ 이전</button>
      <div class="cal-title">${calYear}년 ${calMonth + 1}월</div>
      <button class="ghost" id="calNext">다음 ›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div id="calDetail"></div>
  `;

  document.getElementById('calPrev').onclick = () => {
    calMonth--;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  };
  document.getElementById('calNext').onclick = () => {
    calMonth++;
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  };
  card.querySelectorAll('.cal-day.has-session').forEach(el => {
    el.onclick = () => {
      selectedDate = el.dataset.date;
      renderCalendar();
      renderCalDetail(byDate[selectedDate]);
    };
  });

  if(selectedDate && byDate[selectedDate]){
    renderCalDetail(byDate[selectedDate]);
  }
}

function renderCalDetail(daySessions){
  const detail = document.getElementById('calDetail');
  if(!detail || !daySessions) return;

  const html = daySessions.map((s, idx) => {
    const rate = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
    const itemRows = s.items.map(it => `
      <div class="cal-item-row">
        <div class="mark ${it.correct ? 'good' : 'bad'}" style="color:${it.correct ? 'var(--good)' : 'var(--bad)'}">${it.correct ? '○' : '✕'}</div>
        <div class="${s.kind === 'word' ? 'word' : 'han'}">${it.han}</div>
        <div>${it.meaning}</div>
      </div>
    `).join('');
    return `
      <div class="cal-session">
        <div class="cal-session-summary">${idx + 1}회차 · ${KindLabel(s)} · ${s.correct}/${s.total} 정답 (${rate}%)</div>
        ${itemRows}
      </div>
    `;
  }).join('');

  detail.innerHTML = `
    <div class="cal-detail">
      <div class="cal-detail-title">${selectedDate} 상세</div>
      ${html}
    </div>
  `;
}

// ===== 일본어 단어 =====
const WORDS_KEY = 'hanjaWords';
const _kindKey = 'hanjaKind';
let words = [];
let _kind = localStorage.getItem(_kindKey) === 'word' ? 'word' : 'hanja';
let _tab = 'add';
let _wordPage = 0;
let _wordMode = 'w2m'; // w2m: 단어 → 뜻, m2w: 뜻 → 단어
let _wordQueue = [];
let _wordIndex = 0;
let _wordResults = [];

function LoadWords(){
  try{
    const raw = localStorage.getItem(WORDS_KEY);
    words = raw ? JSON.parse(raw) : [];
  }catch(e){
    words = [];
  }
}

async function SaveWords(){
  try{
    localStorage.setItem(WORDS_KEY, JSON.stringify(words));
    MarkDirty();
  }catch(e){
    console.error('저장 실패', e);
  }
}

function NewId(){
  return Date.now().toString() + Math.random().toString(36).slice(2);
}

function Esc(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function KindLabel(s){
  if(s.kind !== 'word') return '한자';
  return s.mode === 'm2w' ? '단어(뜻→단어)' : '단어(단어→뜻)';
}

function NormalizeWords(list){
  return (list || [])
    .filter(w => w.word && w.meaning)
    .map(w => ({
      id: w.id ? String(w.id) : NewId(),
      word: String(w.word),
      reading: w.reading != null ? String(w.reading) : '',
      meaning: String(w.meaning),
      excluded: w.excluded === true
    }));
}

// 같은 단어+읽는 법은 기존 데이터 유지
async function MergeWords(list){
  let added = 0;
  NormalizeWords(list).forEach(w => {
    if(words.some(x => x.word === w.word && (x.reading || '') === w.reading)) return;
    words.push({ ...w, id: NewId() });
    added++;
  });
  if(added) await SaveWords();
  if(viewWordList.style.display !== 'none') RenderWordList();
}

function SetKind(kind){
  _kind = kind;

document.getElementById('btnWordSave').onclick = async () => {
  const word = document.getElementById('inWord').value.trim();
  const reading = document.getElementById('inReading').value.trim();
  const meaning = document.getElementById('inWordMeaning').value.trim();
  const msg = document.getElementById('wordSaveMsg');

  if(!word || !meaning){
    msg.textContent = '단어와 뜻은 필수 입력입니다.';
    return;
  }
  if(words.some(w => w.word === word) && !confirm(`'${word}'은(는) 이미 등록되어 있습니다. 한 번 더 추가할까요?`)) return;

  words.push({ id: NewId(), word, reading, meaning, excluded: false });
  await SaveWords();

  document.getElementById('inWord').value = '';
  document.getElementById('inReading').value = '';
  document.getElementById('inWordMeaning').value = '';
  document.getElementById('inWordMeaning').placeholder = _meaningHint;
  document.getElementById('inWord').focus();
  if(_wordDict && document.getElementById('inWordSearch').value.trim()) RunWordSearch();
  msg.textContent = `'${word}' 저장 완료`;
  setTimeout(() => msg.textContent = '', 1500);
};

function RenderWordList(){
  const card = document.getElementById('wordListCard');
  if(words.length === 0){
    card.innerHTML = '<div class="empty">등록된 단어가 없습니다.</div>';
    return;
  }

  const totalPages = Math.ceil(words.length / PAGE_SIZE);
  _wordPage = Math.min(Math.max(_wordPage, 0), totalPages - 1);
  const start = _wordPage * PAGE_SIZE;

  const rowsHtml = words.slice(start, start + PAGE_SIZE).map(w => `
    <div class="entry">
      <div class="info" style="padding-left:0">
        <div class="word-main">${Esc(w.word)}</div>
        <div class="meaning">${Esc(w.meaning)}</div>
        <div>읽는 법: ${Esc(w.reading) || '-'}${w.excluded ? ' · 시험 제외' : ''}</div>
      </div>
      <button class="ghost" data-wdict="${w.id}">사전 검색</button>
      <button class="ghost" data-wedit="${w.id}">수정</button>
      <button class="ghost" data-wdel="${w.id}">삭제</button>
    </div>
  `).join('');

  const pagerHtml = totalPages > 1 ? `
    <div class="pager">
      <button class="ghost" id="wordPagePrev" ${_wordPage === 0 ? 'disabled' : ''}>‹ 이전</button>
      <span class="pager-label">${_wordPage + 1} / ${totalPages} 페이지 (총 ${words.length}개)</span>
      <button class="ghost" id="wordPageNext" ${_wordPage >= totalPages - 1 ? 'disabled' : ''}>다음 ›</button>
    </div>
  ` : '';

  card.innerHTML = rowsHtml + pagerHtml;

  card.querySelectorAll('button[data-wdict]').forEach(btn => {
    btn.onclick = () => {
      const w = words.find(x => x.id === btn.dataset.wdict);
      if(w) window.open(`https://ja.dict.naver.com/#/search?query=${encodeURIComponent(w.word)}`, '_blank');
    };
  });
  card.querySelectorAll('button[data-wedit]').forEach(btn => {
    btn.onclick = () => ShowEditWord(btn.dataset.wedit);
  });
  card.querySelectorAll('button[data-wdel]').forEach(btn => {
    btn.onclick = async () => {
      words = words.filter(w => w.id !== btn.dataset.wdel);
      await SaveWords();
      RenderWordList();
    };
  });

  if(totalPages > 1){
    document.getElementById('wordPagePrev').onclick = () => { _wordPage--; RenderWordList(); };
    document.getElementById('wordPageNext').onclick = () => { _wordPage++; RenderWordList(); };
  }
}

    return;

    <div class="self-grade">
      <button class="primary" id="btnModeW2M">단어 → 뜻</button>
      <button class="primary" id="btnModeM2W">뜻 → 단어</button>
    </div>
  `;
  document.getElementById('btnModeW2M').onclick = () => StartWordTest('w2m');
  document.getElementById('btnModeM2W').onclick = () => StartWordTest('m2w');
}

function StartWordTest(mode){
  _wordMode = mode;
  _wordQueue = shuffle(words.filter(w => !w.excluded));
  _wordIndex = 0;
  _wordResults = [];
  RenderWordQuestion();
}

function RenderWordQuestion(){
  const card = document.getElementById('wordTestCard');
  const total = _wordQueue.length;
  if(_wordIndex >= total){
    RenderWordReport();
    return;
  }

  const w = _wordQueue[_wordIndex];
  const w2m = _wordMode === 'w2m';
  card.innerHTML = `
    <div class="test-progress">${_wordIndex + 1} / ${total}</div>
    <div class="prompt">
      <div class="meaning">${Esc(w2m ? w.word : w.meaning)}</div>
      <div class="hint">${w2m ? '이 단어의 뜻을 적으세요.' : '이 뜻에 해당하는 단어를 적으세요.'}</div>
    </div>
    <div class="field">
      <input id="wordAnswer" autocomplete="off" placeholder="${w2m ? '뜻' : '단어 또는 읽는 법'}">
    </div>
    <div class="canvas-actions">
      <button class="ghost" id="btnWordExclude">시험에서 제외하기</button>
    </div>
    <button class="primary" id="btnWordReveal">정답 확인</button>
  `;

  const input = document.getElementById('wordAnswer');
  input.focus();
  input.onkeydown = e => {
    if(e.key === 'Enter' && !e.isComposing) RevealWord(w, input.value.trim());
  };
  document.getElementById('btnWordReveal').onclick = () => RevealWord(w, input.value.trim());
  document.getElementById('btnWordExclude').onclick = async () => {
    if(!confirm(`'${w.word}'을(를) 앞으로 시험에 나오지 않게 할까요?`)) return;
    w.excluded = true;
    await SaveWords();
    _wordQueue.splice(_wordIndex, 1);
    RenderWordQuestion();
  };
}

function IsWordMatch(w, answer){
  const n = str => ToHira((str || '').replace(/\s/g, '').toLowerCase());
  const a = n(answer);
  if(!a) return false;
  if(_wordMode === 'w2m'){
    return n(w.meaning) === a || w.meaning.split(/[,，、;/]/).some(m => n(m) === a);
  }
  return n(w.word) === a || (!!w.reading && n(w.reading) === a);
}

function RevealWord(w, answer){
  const card = document.getElementById('wordTestCard');
  const match = IsWordMatch(w, answer);

  card.innerHTML = `
    <div class="test-progress">${_wordIndex + 1} / ${_wordQueue.length}</div>
    <div class="prompt" style="padding:16px 10px">
      <div class="hint">내 답</div>
      <div style="font-size:18px;margin:4px 0 16px">
        ${Esc(answer) || '(미입력)'}
        ${match ? '<span style="color:var(--good);font-size:12px">· 일치</span>' : ''}
      </div>
      <div class="reveal-han" style="font-size:32px;margin:0">${Esc(w.word)}</div>
      <div class="hint">${Esc(w.reading)}</div>
      <div style="font-size:18px;margin-top:8px">${Esc(w.meaning)}</div>
    </div>
    <div class="hint" style="text-align:center;margin-bottom:12px">정답과 맞았나요?</div>
    <div class="self-grade">
      <button class="bad-btn" id="btnWordWrong">틀렸어요</button>
      <button class="good-btn" id="btnWordRight">맞았어요</button>
    </div>
  `;

  function Grade(correct){
    _wordResults.push({ w, answer, correct });
    _wordIndex++;
    RenderWordQuestion();
  }
  document.getElementById('btnWordRight').onclick = () => Grade(true);
  document.getElementById('btnWordWrong').onclick = () => Grade(false);
}

// ===== 사전 검색 (dict.json: [한자, 뜻, 훈독, 음독], 빈도순) =====
const _dictUrl = 'dict.json';
const _maxResults = 30;
let _dict = null;
let _dictLoading = null;

function LoadDict(){
  if(_dict) return Promise.resolve(_dict);
  if(!_dictLoading){
    _dictLoading = fetch(_dictUrl)
      .then(r => {
        if(!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(j => _dict = j.d)
      .catch(e => {
        _dictLoading = null;
        throw e;
      });
  }
  return _dictLoading;
}

function ToHira(str){
  return str.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}

// "い(きる)" → ["いきる", "い"]
function ReadingKeys(text){
  if(!text) return [];
  return text.split('、').flatMap(r => [r.replace(/[()]/g, ''), r.replace(/\(.*\)/, '')]);
}

function SearchDict(query){
  const q = query.trim();
  if(!q) return [];

  // 한자: 입력한 글자 순서대로
  const hans = [...q].filter(ch => /\p{Script=Han}/u.test(ch));
  if(hans.length){
    return [...new Set(hans)].map(h => _dict.find(r => r[0] === h)).filter(Boolean);
  }

  // 가나: 훈독/음독 일치
  if(/[\u3040-\u30ff]/.test(q)){
    const k = ToHira(q.replace(/\s/g, ''));
    return _dict
      .filter(r => ReadingKeys(r[2]).includes(k) || ReadingKeys(r[3]).includes(k))
      .slice(0, _maxResults);
  }

  // 한글: 훈음 일치 > 음 일치 > 부분 일치
  const n = q.replace(/\s/g, '');
  const scored = [];
  for(const r of _dict){
    if(!r[1]) continue;
    const senses = r[1].split(', ').map(x => x.replace(/\s/g, ''));
    let score = -1;
    if(senses.includes(n)) score = 0;
    else if(n.length === 1 && senses.some(x => x.endsWith(n))) score = 1;
    else if(senses.some(x => x.includes(n))) score = 2;
    if(score >= 0) scored.push({ r, score });
  }
  return scored
    .sort((a, b) => a.score - b.score)
    .slice(0, _maxResults)
    .map(x => x.r);
}

async function RunSearch(){
  const box = document.getElementById('searchResult');
  const query = document.getElementById('inSearch').value;
  if(!query.trim()){
    box.innerHTML = '';
    return;
  }
  if(!_dict) box.innerHTML = '<div class="empty">사전 불러오는 중…</div>';
  try{
    await LoadDict();
  }catch(e){
    console.error(e);
    box.innerHTML = location.protocol === 'file:'
      ? '<div class="empty">사전 검색은 GitHub 링크에서 사용할 수 있습니다.</div>'
      : '<div class="empty">사전을 불러오지 못했습니다. dict.json이 같은 폴더에 있는지 확인해 주세요.</div>';
    return;
  }
  RenderSearch(SearchDict(query));
}

function RenderSearch(results){
  const box = document.getElementById('searchResult');
  if(results.length === 0){
    box.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }
  const has = new Set(entries.map(e => e.han));
  box.innerHTML = results.map((r, i) => `
    <div class="entry">
      <div class="han">${r[0]}</div>
      <div class="info">
        <div class="meaning">${r[1] || '(뜻 없음)'} ${has.has(r[0]) ? '<span class="tag">등록됨</span>' : ''}</div>
        <div>훈독: ${r[2] || '-'} · 음독: ${r[3] || '-'}</div>
      </div>
      <button class="ghost" data-fill="${i}">채우기</button>
      <button class="ghost" data-add="${i}">추가</button>
    </div>
  `).join('');

  box.querySelectorAll('button[data-fill]').forEach(btn => {
    btn.onclick = () => FillForm(results[Number(btn.dataset.fill)]);
  });
  box.querySelectorAll('button[data-add]').forEach(btn => {
    btn.onclick = () => AddFromDict(results[Number(btn.dataset.add)], results);
  });
}

function FillForm(r){
  document.getElementById('inHan').value = r[0];
  document.getElementById('inKun').value = r[2];
  document.getElementById('inOn').value = r[3];
  document.getElementById('inMeaning').value = r[1];
  const target = document.getElementById(r[1] ? 'inHan' : 'inMeaning');
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.focus();
}

async function AddFromDict(r, results){
  const msg = document.getElementById('saveMsg');
  if(!r[1]){
    FillForm(r);
    msg.textContent = '뜻을 입력한 뒤 저장해 주세요.';
    return;
  }
  if(entries.some(e => e.han === r[0]) && !confirm(`'${r[0]}'은(는) 이미 등록되어 있습니다. 한 번 더 추가할까요?`)) return;

  entries.push({
    id: Date.now().toString() + Math.random().toString(36).slice(2),
    han: r[0],
    kun: r[2],
    on: r[3],
    meaning: r[1]
  });
  await saveEntries();
  RenderSearch(results);
  msg.textContent = `'${r[0]}' 저장 완료`;
  setTimeout(() => msg.textContent = '', 1500);
}

document.getElementById('btnSearch').onclick = RunSearch;
document.getElementById('inSearch').onkeydown = e => {
  if(e.key === 'Enter' && !e.isComposing) RunSearch();
};

// ===== 단어 사전 검색 (words_dict.json: [단어, 읽는 법, 영어 뜻, 다른 표기]) =====
const _wordDictUrl = 'words_dict.json';
const _meaningHint = '예: 등산';
let _wordDict = null;
let _wordDictLoading = null;

function LoadWordDict(){
  if(_wordDict) return Promise.resolve(_wordDict);
  if(!_wordDictLoading){
    _wordDictLoading = fetch(_wordDictUrl)
      .then(r => {
        if(!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(j => _wordDict = j.d)
      .catch(e => {
        _wordDictLoading = null;
        throw e;
      });
  }
  return _wordDictLoading;
}

// 일본어: 일치 > 앞부분 일치 > 포함 / 영어: 뜻 일치 > 포함
function SearchWords(query){
  const q = query.trim();
  const scored = [];

  if(/[\u3040-\u30ff\u3400-\u9fff々]/.test(q)){
    const k = ToHira(q.replace(/\s/g, ''));
    for(const r of _wordDict){
      const forms = [r[0], r[1], ...(r[3] ? r[3].split('|') : [])].filter(Boolean).map(ToHira);
      let score = -1;
      if(forms.includes(k)) score = 0;
      else if(forms.some(f => f.startsWith(k))) score = 1;
      else if(forms.some(f => f.includes(k))) score = 2;
      if(score >= 0) scored.push({ r, score });
    }
  } else {
    const n = q.toLowerCase();
    for(const r of _wordDict){
      const terms = r[2].toLowerCase().split(/[;,]\s*/);
      let score = -1;
      if(terms.includes(n) || terms.includes('to ' + n)) score = 0;
      else if(terms.some(t => t.split(/[\s()]+/).includes(n))) score = 1;
      else if(r[2].toLowerCase().includes(n)) score = 2;
      if(score >= 0) scored.push({ r, score });
    }
  }
  return scored
    .sort((a, b) => a.score - b.score)
    .slice(0, _maxResults)
    .map(x => x.r);
}

async function RunWordSearch(){
  const box = document.getElementById('wordSearchResult');
  const query = document.getElementById('inWordSearch').value.trim();
  if(!query){
    box.innerHTML = '';
    return;
  }
  if(/[\uac00-\ud7a3]/.test(query)){
    box.innerHTML = '<div class="empty">한국어 뜻 검색은 지원하지 않습니다.<br>일본어(한자·가나)나 영어로 검색해 주세요.</div>';
    return;
  }
  if(!_wordDict) box.innerHTML = '<div class="empty">사전 불러오는 중…</div>';
  try{
    await LoadWordDict();
  }catch(e){
    console.error(e);
    box.innerHTML = location.protocol === 'file:'
      ? '<div class="empty">사전 검색은 GitHub 링크에서 사용할 수 있습니다.</div>'
      : '<div class="empty">사전을 불러오지 못했습니다. words_dict.json이 같은 폴더에 있는지 확인해 주세요.</div>';
    return;
  }
  RenderWordSearch(SearchWords(query));
}

function RenderWordSearch(results){

  if(results.length === 0){
    box.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';

  const has = new Set(words.map(w => w.word));
  box.innerHTML = results.map((r, i) => `

      </div>
      <button class="ghost" data-wfill="${i}">채우기</button>
    </div>
  `).join('');

  box.querySelectorAll('button[data-wfill]').forEach(btn => {
    btn.onclick = () => FillWordForm(results[Number(btn.dataset.wfill)]);
  });
}

// 한국어 뜻은 사전에 없어서 영어 뜻을 힌트로 보여주고 직접 입력
function FillWordForm(r){
  document.getElementById('inWord').value = r[0];
  document.getElementById('inReading').value = r[1];

  meaning.value = '';

  meaning.scrollIntoView({ behavior: 'smooth', block: 'center' });

document.getElementById('btnWordSearch').onclick = RunWordSearch;
document.getElementById('inWordSearch').onkeydown = e => {
  if(e.key === 'Enter' && !e.isComposing) RunWordSearch();
};
document.getElementById('inWordMeaning').onkeydown = e => {
  if(e.key === 'Enter' && !e.isComposing) document.getElementById('btnWordSave').click();

// ===== Google Sheets 연동 =====
const _clientId = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
const _scope = 'https://www.googleapis.com/auth/drive.file';
const _fileName = 'HanjaMemorizer';
const _tabs = ['entries', 'sessions', 'words'];
const _sheetKey = 'hanjaSheetId';
const _syncedKey = 'hanjaSheetSynced';
const _dirtyKey = 'hanjaSheetDirty';
const _accountKey = 'hanjaSheetAccount';
const _pickKey = 'hanjaSheetPick'; // 로그아웃 후 다음 로그인은 계정 선택

let _tokenClient = null;
let _token = null;
let _tokenExp = 0;
let _sheetId = localStorage.getItem(_sheetKey);
let _account = null;
let _synced = false; // 이번 접속에서 시트와 첫 동기화 완료 여부
let _hold = false;   // 병합 중 자동 저장 보류
let _ver = 0;
let _pushTimer = null;
let _refreshing = false;
const _refreshBefore = 5 * 60 * 1000; // 만료 5분 전부터 갱신

function InitAuth(){
  _tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: _clientId,
    scope: _scope,
    callback: () => {}
  });
}

function IsLogin(){
  return !!_token && Date.now() < _tokenExp;
}

function RequestToken(prompt = ''){
  return new Promise((resolve, reject) => {
    if(!_tokenClient) return reject(new Error('구글 로그인 모듈을 불러오지 못했습니다.'));
    _tokenClient.callback = r => {
      if(r.error) return reject(new Error(r.error));
      _token = r.access_token;
      _tokenExp = Date.now() + (r.expires_in - 60) * 1000;
      setTimeout(() => {
        if(IsLogin()) return;
        SetStatus('로그인 만료 · 화면을 클릭하면 다시 연결됩니다', true);
        UpdateAuthUI();
      }, _tokenExp - Date.now() + 500);
      resolve();
    };
    _tokenClient.error_callback = err => reject(new Error(err.type || '로그인 취소'));
    const hint = prompt ? undefined : (_account || localStorage.getItem(_accountKey) || undefined);
    _tokenClient.requestAccessToken({ prompt, login_hint: hint });
  });
}

async function Api(url, method = 'GET', body){
  if(!IsLogin()) throw new Error('로그인이 필요합니다.');
  const res = await fetch(url, {
    method,
    headers: { Authorization: `Bearer ${_token}`, 'Content-Type': 'application/json' },
    body: body && JSON.stringify(body)
  });
  if(res.status === 401){
    _token = null;
    throw new Error('로그인이 만료되었습니다.');
  }
  if(!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.status === 204 ? null : res.json();
}

// 앱이 만든 시트를 찾고, 없으면 생성 (다른 기기에서도 같은 시트 사용)
async function FindOrCreate(){
  const q = encodeURIComponent(
    `name='${_fileName}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const list = await Api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  if(list.files.length){
    await EnsureTabs(list.files[0].id);
    return list.files[0].id;
  }

  const created = await Api('https://sheets.googleapis.com/v4/spreadsheets', 'POST', {
    properties: { title: _fileName },
    sheets: _tabs.map(t => ({ properties: { title: t } }))
  });
  return created.spreadsheetId;
}

// 기존 시트에 새로 생긴 탭 추가
async function EnsureTabs(id){
  const info = await Api(`https://sheets.googleapis.com/v4/spreadsheets/${id}?fields=sheets.properties.title`);
  const have = info.sheets.map(x => x.properties.title);
  const missing = _tabs.filter(t => !have.includes(t));
  if(missing.length === 0) return;
  await Api(`https://sheets.googleapis.com/v4/spreadsheets/${id}:batchUpdate`, 'POST', {
    requests: missing.map(t => ({ addSheet: { properties: { title: t } } }))
  });
}

async function SheetSave(data){
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${_sheetId}/values`;
  await Api(`${url}:batchClear`, 'POST', { ranges: _tabs });
  await Api(`${url}:batchUpdate`, 'POST', {
    valueInputOption: 'RAW',
    data: _tabs.map(t => ({ range: t, values: ToRows(data[t] || []) }))
  });
}

async function SheetLoad(){
  const ranges = _tabs.map(t => `ranges=${t}`).join('&');
  const res = await Api(
    `https://sheets.googleapis.com/v4/spreadsheets/${_sheetId}/values:batchGet?${ranges}&valueRenderOption=UNFORMATTED_VALUE`);
  const data = {};
  res.valueRanges.forEach((v, i) => data[_tabs[i]] = ToObjects(v.values || []));
  return {
    entries: NormalizeEntries(data.entries),
    sessions: NormalizeSessions(data.sessions),
    words: NormalizeWords(data.words)
  };
}

// 1행 = 헤더(키), 이후 행 = 항목
function ToRows(items){
  if(!items.length) return [];
  const keys = [...new Set(items.flatMap(Object.keys))];
  return [keys, ...items.map(o => keys.map(k => ToCell(o[k])))];
}

function ToCell(v){
  if(v == null) return '';
  return typeof v === 'object' ? JSON.stringify(v) : v;
}

function ToObjects([keys, ...rows]){
  if(!keys) return [];
  return rows.map(r => Object.fromEntries(keys.map((k, i) => [k, FromCell(r[i])])));
}

function FromCell(v){
  if(typeof v === 'string' && /^[\[{]/.test(v)){
    try{ return JSON.parse(v); }catch(e){}
  }
  return v === '' ? undefined : v;
}

function NormalizeEntries(list){
  return list
    .filter(e => e.han && e.meaning)
    .map(e => ({
      id: e.id ? String(e.id) : Date.now().toString() + Math.random().toString(36).slice(2),
      han: String(e.han),
      on: e.on != null ? String(e.on) : '',
      kun: e.kun != null ? String(e.kun) : '',
      meaning: String(e.meaning),
      excluded: e.excluded === true
    }));
}

function NormalizeSessions(list){
  return list
    .filter(s => s.date)
    .map(s => ({ ...s, items: Array.isArray(s.items) ? s.items : [] }));
}

function MarkDirty(){
  localStorage.setItem(_dirtyKey, '1');
  _ver++;
  if(_synced) SchedulePush();
}

function SchedulePush(delay = 1500){
  clearTimeout(_pushTimer);
  if(_hold) return;
  if(!IsLogin()){
    SetStatus('로그인 만료 · 화면을 클릭하면 다시 연결 후 저장됩니다', true);
    UpdateAuthUI();
    return;
  }
  SetStatus('저장 대기…');
  _pushTimer = setTimeout(Push, delay);
}

async function Push(){
  if(!_sheetId || !IsLogin()) return;
  const ver = _ver;
  SetStatus('저장 중…');
  try{
    await SheetSave({ entries, sessions, words });
    if(ver === _ver) localStorage.removeItem(_dirtyKey);
    SetStatus('시트에 저장됨');
  }catch(e){
    console.error(e);
    SetStatus('저장 실패 · ' + e.message, true);
    UpdateAuthUI();
  }
}

async function GetEmail(){
  const r = await Api('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)');
  return r.user.emailAddress;
}

async function Login(prompt){
  if(prompt === undefined) prompt = localStorage.getItem(_pickKey) ? 'select_account' : '';
  try{
    SetStatus('로그인 중…');
    await RequestToken(prompt);
    localStorage.removeItem(_pickKey);
    const email = await GetEmail();
    const prev = localStorage.getItem(_accountKey);
    const changed = !!prev && prev !== email;

    // 같은 계정 재로그인
    if(_synced && !changed){
      _account = email;
      if(localStorage.getItem(_dirtyKey)) await Push();
      else SetStatus('시트 연결됨');
      return;
    }

    let mode;
    if(changed){
      mode = await AskAccountChange(prev, email);
      if(mode === 'cancel'){
        Logout();
        SetStatus('계정 전환 취소 · 로그아웃됨');
        return;
      }
    }

    _synced = false;
    _account = email;
    localStorage.setItem(_accountKey, email);
    UpdateAuthUI();
    _sheetId = await FindOrCreate();
    localStorage.setItem(_sheetKey, _sheetId);
    await FirstSync(mode);
  }catch(e){
    console.error(e);
    SetStatus('로그인 실패 · ' + e.message, true);
  }finally{
    UpdateAuthUI();
  }
}

async function SwitchAccount(){
  clearTimeout(_pushTimer);
  if(IsLogin() && localStorage.getItem(_dirtyKey)) await Push(); // 현재 계정에 먼저 저장
  await Login('select_account');
}

function AskAccountChange(prev, email){
  return new Promise(resolve => {
    const dirty = !!localStorage.getItem(_dirtyKey);
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(43,38,32,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;';
    overlay.innerHTML = `
      <div class="card" style="max-width:360px;width:100%;">
        <div class="msg" style="padding:0 0 12px;word-break:break-all;">
          계정이 바뀌었습니다<br>${prev} → ${email}<br>현재 기기의 데이터를 어떻게 할까요?
          ${dirty ? '<br><span style="color:var(--bad)">시트에 저장되지 않은 변경이 있습니다.</span>' : ''}
        </div>
        <button class="primary" data-mode="replace">새 계정 시트로 덮어쓰기</button>
        <div class="hint" style="font-size:11px;color:var(--ink-soft);margin:4px 0 12px;">새 계정 시트가 비어 있으면 빈 상태로 시작합니다.</div>
        <button class="ghost" data-mode="merge" style="width:100%;padding:10px;margin-bottom:8px;">현재 데이터를 새 계정에 병합</button>
        <button class="ghost" data-mode="cancel" style="width:100%;padding:10px;">취소</button>
      </div>
    `;
    overlay.querySelectorAll('button[data-mode]').forEach(btn => {
      btn.onclick = () => {
        overlay.remove();
        resolve(btn.dataset.mode);
      };
    });
    document.body.appendChild(overlay);
  });
}

// mode: undefined(자동) | 'replace' | 'merge'
async function FirstSync(mode){
  SetStatus('시트 불러오는 중…');
  const data = await SheetLoad();
  const hasSheet = data.entries.length > 0 || data.sessions.length > 0 || data.words.length > 0;
  const known = localStorage.getItem(_syncedKey) === _sheetId;
  const dirty = !!localStorage.getItem(_dirtyKey);
  localStorage.setItem(_syncedKey, _sheetId);
  _synced = true;

  if(mode === 'replace'){
    ReplaceLocal(data);
    SetStatus('시트에서 불러옴');
    return;
  }
  if(!hasSheet){
    await Push();
    return;
  }
  if(mode !== 'merge' && known && !dirty){
    ReplaceLocal(data);
    SetStatus('시트에서 불러옴');
    return;
  }

  // 처음 연결한 기기거나 저장 안 된 변경이 있으면 병합 (다른 내용은 선택 UI)
  _hold = true;
  SetStatus('시트 데이터 병합 중…');
  await MergeWords(data.words);
  await mergeSessions(data.sessions);
  processImport(data.entries);
}

async function PullSheet(){
  if(!confirm('시트 데이터로 현재 데이터를 덮어쓸까요?')) return;
  try{
    SetStatus('시트 불러오는 중…');
    ReplaceLocal(await SheetLoad());
    SetStatus('시트에서 불러옴');
  }catch(e){
    console.error(e);
    SetStatus('불러오기 실패 · ' + e.message, true);
    UpdateAuthUI();
  }
}

function ReplaceLocal(data){
  clearTimeout(_pushTimer);
  entries = data.entries;
  sessions = data.sessions;
  words = data.words;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
  localStorage.setItem(WORDS_KEY, JSON.stringify(words));
  localStorage.removeItem(_dirtyKey);
  if(viewList.style.display !== 'none') renderList();
  if(viewCalendar.style.display !== 'none') renderCalendar();
  if(viewWordList.style.display !== 'none') RenderWordList();
}

function Logout(){
  clearTimeout(_pushTimer);
  if(_token) google.accounts.oauth2.revoke(_token);
  _token = null;
  _tokenExp = 0;
  _synced = false;
  _account = null;
  localStorage.setItem(_pickKey, '1');
  SetStatus('로그인하지 않음');
  UpdateAuthUI();
}

function UpdateAuthUI(){
  const on = IsLogin();
  const btnLogin = document.getElementById('btnLogin');
  btnLogin.style.display = on ? 'none' : '';
  btnLogin.textContent = _synced ? '다시 로그인' : '구글 로그인';
  document.getElementById('btnPull').style.display = on && _synced ? '' : 'none';
  document.getElementById('btnSwitch').style.display = on ? '' : 'none';
  document.getElementById('btnLogout').style.display = on ? '' : 'none';
}

function SetStatus(text, warn = false){
  const el = document.getElementById('syncStatus');
  el.textContent = (_account && IsLogin() ? `${_account} · ` : '') + text;
  el.classList.toggle('warn', warn);
}

// 토큰 자동 갱신: 팝업 차단을 피하려고 유저 클릭 시점에 재발급
function NeedRefresh(){
  return _synced && _tokenClient && !_refreshing && _tokenExp - Date.now() < _refreshBefore;
}

async function RefreshToken(){
  _refreshing = true;
  try{
    await RequestToken();
    UpdateAuthUI();
    if(localStorage.getItem(_dirtyKey)) SchedulePush(0);
    else SetStatus('시트 연결됨');
  }catch(e){
    console.error(e);
  }finally{
    _refreshing = false;
  }
}

document.addEventListener('click', e => {
  if(!NeedRefresh()) return;
  if(e.target.closest('#drawCanvas, #btnLogin, #btnSwitch, #btnLogout')) return;
  RefreshToken();
}, true);

document.getElementById('btnLogin').onclick = () => Login();
document.getElementById('btnSwitch').onclick = SwitchAccount;
document.getElementById('btnPull').onclick = PullSheet;
document.getElementById('btnLogout').onclick = Logout;

window.addEventListener('beforeunload', e => {
  if(_synced && localStorage.getItem(_dirtyKey)){
    e.preventDefault();
    e.returnValue = '';
  }
});

(async () => {
  await loadEntries();
  await loadSessions();
  LoadWords();
  SetKind(_kind);
  UpdateAuthUI();
  if(location.protocol === 'file:') SetStatus('구글 연동은 GitHub 링크에서 사용할 수 있습니다', true);
})();
</script>
